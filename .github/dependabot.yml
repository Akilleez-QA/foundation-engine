version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: development
    ignore:
      # Pinned exactly: the bench and quality guard depend on its browser protocol. Bump by hand.
      - dependency-name: playwright-core
      # Major upgrades are deliberate migrations, not automatic bumps:
      # TypeScript majors remove compiler options (6 deprecated baseUrl); three is read through a
      # version-checked adapter over private renderer state; vite majors change
      # the build; @types/node tracks the Node 22 minimum that CI runs.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      # three is 0.x, so a minor release is a breaking release.
      - dependency-name: three
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@types/three'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
