name: Bug report
description: A reproducible engine, kit, or template defect.
title: '[Bug]: '
labels: ['needs-triage', 'bug']
body:
  - type: markdown
    attributes:
      value: 'Describe systems and patterns instead of external game names or source-project references. Keep required attribution and exact reproduction identifiers. See CONTRIBUTING.md, Describe systems and patterns.'
  - type: markdown
    attributes:
      value: 'For suspected vulnerabilities, read SECURITY.md first. Do not post exploits, secrets, private assets, or personal information.'
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
      description: Explain what should happen and what happens instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a small example or template, exact steps/commands, and a seed if relevant. Remove private data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Commit/version, selected template or GAME_DIR, OS, Node/npm, browser/version, device and input method. Include GPU and viewport for rendering/performance problems.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: 'Your rating; maintainers may change it. Definitions: docs/plan/software-management-plan.md, Problem reporting and severity.'
      options:
        - 'S1: wrong result presented as valid, save data loss, or security exposure'
        - 'S2: feature unusable, no workaround'
        - 'S3: feature degraded, workaround exists'
        - 'S4: cosmetic or documentation'
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Any way to avoid the problem for now, or "none known". The pull request that fixes it records how the fix was verified.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Relevant error output, screenshots, or measured performance; distinguish development from production measurements.
