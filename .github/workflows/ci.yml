name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Monday 06:00 UTC runs node-current only. The concurrency group includes the event name so this
  # schedule does not queue behind a push to main. cancel-in-progress is only for pull requests.
  schedule:
    - cron: '0 6 * * 1'

# Fork contributions run tests without deployment credentials or repository writes.
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path filter for docs/** and **/*.md. Runs on every event so dependents are not skipped behind it:
  # node-current needs this job and its if has no status function, so a skipped changes job would skip
  # node-current too. The weekly schedule reports code=true and does not diff. Node 22 jobs still require
  # the event to be a push or pull request, so that output does not start them on Monday.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The diff needs the pull-request base or the previous push.
          persist-credentials: false
      - id: paths
        name: Detect changes outside docs and Markdown
        run: node scripts/ci-changes.mjs

  browser:
    needs: [changes]
    # Pull requests and pushes to main run this job when the diff contains code. The weekly schedule does not.
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The budget ratchet compares against origin/main.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install isolated test browser
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Optional UI framework browser regressions
        run: npm run test:ui-browser
      - name: Optional diagnostic browser regressions
        run: npm run test:diagnostics-browser
      - name: Optional capture matrix browser regressions
        run: npm run test:capture-browser
      - name: Optional manual authoring browser regressions
        run: npm run test:authoring-browser
      - name: Optional appearance browser regressions
        run: npm run test:appearance-browser
      - name: Optional staged journal browser regressions
        run: npm run test:stage-journal-browser
      - name: Asynchronous model preview browser regressions
        run: npm run test:model-preview-browser
      - name: KTX2 model texture browser regressions
        run: npm run test:ktx2-browser
      - name: Optional framework browser regressions
        run: GAME_DIR=templates/expedition/game npm run test:framework-browser
      - name: Optional regional surface browser regressions
        run: GAME_DIR=templates/expedition/game npm run test:regional-surface-browser
      - name: Optional model attachment browser regressions
        run: GAME_DIR=templates/expedition/game npm run test:model-attachment-browser
      - name: Optional progression workbench browser regressions
        run: GAME_DIR=templates/expedition/game npm run test:progression-workbench-browser
      - name: Optional weighted appearance browser regressions
        run: GAME_DIR=templates/expedition/game npm run test:weighted-appearance-browser
      - name: Optional custody composition browser regressions
        run: GAME_DIR=templates/expedition/game npm run test:custody-composition-browser
      - name: Optional objective workbench browser regressions
        run: GAME_DIR=templates/expedition/game npm run test:objective-workbench-browser
      - name: Optional action workbench browser regressions
        run: GAME_DIR=templates/expedition/game npm run test:action-workbench-browser
      - name: Optional crafting workbench browser regressions
        run: GAME_DIR=templates/expedition/game npm run test:crafting-workbench-browser
      - name: Optional network workbench browser regressions
        run: GAME_DIR=templates/expedition/game npm run test:network-workbench-browser
      - name: Optional scoped replication browser regressions
        run: GAME_DIR=templates/expedition/game npm run test:replication-workbench-browser
      - name: Durable authority browser workflow
        run: GAME_DIR=templates/expedition/game npm run test:authority-workbench-browser
      - name: Blender export consumer and brief
        run: npm run test:blender-export-browser
      - name: Pose-to-pose clips in the stock loader
        run: npm run test:pose-to-pose-browser
      - name: Spatial audio offline-render regressions
        run: npm run test:audio-browser
      - name: Advisory first-use browser observations
        run: npm run test:first-use-browser
      - name: Advisory first-use browser observations, production build
        run: npm run test:first-use-browser:production
      - name: Creator explorer journey browser regression
        run: npm run test:creator-journey-browser
      - name: Shared session two-browser workflow (MP-01)
        run: npm run test:session-browser
      - name: Optional replay and divergence browser regressions
        run: npm run test:replay-browser
      - name: Deterministic maths, Chromium against Node (W1-2)
        run: npm run test:dmath-browser
      - name: Network overload probe regression, loopback only (NW-07)
        run: npm run test:network-probe
      - name: Authored material browser regressions
        run: npm run test:material-browser
      - name: Particle emitter browser regressions
        run: npm run test:particle-browser
      - name: Sound file browser regressions
        run: npm run test:sound-browser
      - name: Sub-path production build browser regressions
        run: npm run test:subpath-browser

  templates-1:
    needs: [changes]
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The budget ratchet compares against origin/main.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install isolated test browser
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Complete template shard 1 of 2, including phone smoke
        run: npm run gate:templates -- --shard 1/2 --phone

  templates-2:
    needs: [changes]
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The budget ratchet compares against origin/main.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install isolated test browser
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Complete template shard 2 of 2, including phone smoke
        run: npm run gate:templates -- --shard 2/2 --phone

  # The supported range is Node 22.18 or newer; the other jobs use 22. This cheap job (no browser, no template
  # gates) runs the complete test suite and the quick check on the newest Node major, so a Node change (such as the
  # Node 23 default test reporter) fails here first. Raise node-version when a newer Node major is released.
  # It runs on a push to main that changes code (the push trigger lists only main) and on the weekly
  # schedule, not on pull requests and not on a docs-only push.
  node-current:
    needs: [changes]
    if: github.event_name == 'schedule' || (github.event_name == 'push' && needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The budget ratchet in npm run check compares against origin/main.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Complete test suite on the newest Node
        run: npm run test
      - name: Quick check on the newest Node
        run: npm run check

  check:
    needs: [changes, browser, templates-1, templates-2, node-current]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Require every work job to succeed
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: node scripts/ci-results.mjs
