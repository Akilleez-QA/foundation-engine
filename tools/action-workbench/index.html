<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foundation · Action workbench</title><link rel="icon" href="data:,"></head><body><main id="app" class="app-root"><header id="summary"><div><strong>Action workbench</strong><p id="compact-status">Preparing session…</p></div><button id="open" disabled>Open controls</button></header><aside id="legend">A · teal / B · amber — size shows accepted resource. Session only; no save.</aside></main><template id="details-template"><section id="details" role="dialog" aria-modal="true" aria-labelledby="title"><header><h1 id="title">Actions, target identity and optional cues</h1><button id="close">Close</button></header><div class="sheet-scroll" tabindex="0" role="region" aria-label="Action workbench controls"><p id="state"></p><div class="columns"><section><h2>Discrete action</h2><label>Target <select id="target"><option value="a">A</option><option value="b">B</option></select></label><label>Requested amount <input id="amount" type="number" min="1" max="20" value="3"></label><label>Ready after <input id="delay" type="number" min="0" max="100" value="2"></label><label>Expiry after <input id="expiry" type="number" min="1" max="100" value="10"></label><button id="prepare">Prepare new action</button><label>Retained action <select id="action"></select></label><div class="buttons"><button id="resolve">Resolve / retry exact action</button><button id="cancel">Cancel action</button></div><p id="action-state"></p><h2>Authority clock</h2><label>Advance by <input id="advance-by" type="number" min="0" max="100" value="2"></label><button id="advance">Advance authority</button><h2>Live target</h2><div class="buttons"><button id="replace">Replace selected entity</button><button id="despawn">Despawn selected entity</button><button id="restore">Restore absent entity</button><button id="toggle-target">Toggle target eligibility</button></div></section><section><h2>Creator-selected resolution policy</h2><label>Policy <select id="policy"><option value="normal">Eligible targets, guaranteed hit</option><option value="replace">Replace target during eligibility (stale proof)</option><option value="revise">Revise target during hit (stale proof)</option></select></label><button id="set-policy">Apply policy</button><h2>Temporary policy inputs</h2><p>Amount multiplier uses an exact expiring handle. Replacing its key does not transfer authority to the old handle.</p><label>Multiplier <input id="multiplier" type="number" min="0" max="4" value="2"></label><label>Effect duration <input id="effect-duration" type="number" min="1" max="100" value="4"></label><div class="buttons"><button id="effect">Apply / replace multiplier</button><button id="cancel-old-effect">Cancel first retained handle</button><button id="cancel-effect">Cancel current handle</button></div><p id="effect-state"></p><h2>Optional presentation</h2><label><input id="cues" type="checkbox" checked>Enable cue media</label><label>Presentation advance by <input id="cue-step" type="number" min="0" max="100" value="1"></label><div class="buttons"><button id="cue-advance">Advance cue clock</button><button id="cue-seek">Seek ahead without cues</button><button id="cue-overload">Attempt excessive catch-up</button></div><p id="cue-state"></p></section></div><h2>Accepted consequences</h2><p id="resources"></p><ol id="receipts"></ol><p id="message" role="status" aria-live="polite"></p><h2>Session lifetime</h2><div class="buttons"><button id="exit-scene">Exit scene and retire session</button><button id="reenter">Start fresh session</button><button id="late-resolve">Invoke retained old resolution</button></div><p>This desktop diagnostic selects its own example policies. It is not a combat game, save system or network authority. Authority time and presentation time are independent.</p></div></section></template><script type="module" src="./entry.mjs"></script></body></html>
